# Order matters, the last entry wins: upstream-33 classifies every app of the official 33.0.9 archive, common
# then forces files and dav on and removes workflowengine and firstrunwizard.
extends: [upstream-33, common]
# apps-upstream comes from the base upstream-33; apps-flavor1 holds the apps only this flavor adds (submodules).
app_dirs: [apps-upstream, apps-flavor1]
apps:
  activity: default
  # The added apps are `default`: enabled at install so users have them at once, but an admin may disable them.
  # They are not `always`, which would make them impossible to switch off.
  contacts: default
  calendar: default
  tasks: default
  notes: default
  # groupfolders cannot be enabled by `occ maintenance:install`: its migrations need the app loaded, which the installer
  # does not do. So it is `available` and ncw-configure.sh enables it right after the install.
  groupfolders: available
enable_after_install: [groupfolders]
